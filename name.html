<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Before We Begin</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="page">
    <div class="card">

      <div class="emoji">🌷</div>

      <p class="small-text">Before we continue...</p>

      <h1>What's your name?</h1>

      <p class="description">
        Just your full name. Nothing complicated.
      </p>

      <form id="nameForm">

        <input
          type="text"
          id="nameInput"
          placeholder="Enter your full name"
          autocomplete="name"
          required
        >

        <button type="submit" class="button">
          Next →
        </button>

      </form>

    </div>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
