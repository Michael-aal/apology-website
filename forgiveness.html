<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One Question</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="page">
    <div class="card">

      <div class="emoji">🥺</div>

      <p class="small-text">
        Okay, <span class="user-name"></span>...
      </p>

      <h1>Do you forgive me?</h1>

      <p class="description">
        You don't have to say anything you don't genuinely feel.
        I just wanted to ask.
      </p>

      <div class="choice-buttons">

        <button
          class="button"
          onclick="saveResponse('Yes, I forgive you 🤍')"
        >
          Yes, I forgive you 🤍
        </button>

        <button
          class="button secondary-button"
          onclick="saveResponse('I need some time 🌷')"
        >
          I need some time 🌷
        </button>

      </div>

    </div>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
